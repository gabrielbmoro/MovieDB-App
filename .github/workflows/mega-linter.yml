# MegaLinter GitHub Action configuration file
# More info at https://megalinter.io
---
name: MegaLinter

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest

    # Give the default GITHUB_TOKEN write permission to commit and push, comment
    # issues, and post new Pull Requests; remove the ones you do not need
    permissions:
      contents: write
      pull-requests: write

    steps:
      # Git Checkout
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.PAT || secrets.GITHUB_TOKEN }}

          fetch-depth: 0

      # Expose Gradle build at repository root so MegaLinter can detect it
      - name: Expose Gradle build to MegaLinter
        run: |
          cp -a src/gradlew src/gradlew.bat src/gradle.properties src/settings.gradle.kts src/build.gradle.kts . || true
          chmod +x ./gradlew || true

      # MegaLinter
      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/java@v8
        id: ml

        env:
          VALIDATE_ALL_CODEBASE: true
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
